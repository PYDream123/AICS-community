services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aics-postgres
    environment:
      POSTGRES_DB: aics
      POSTGRES_USER: aics
      POSTGRES_PASSWORD: aics
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - aics-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aics -d aics"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aics-pgdata:
